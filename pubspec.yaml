name: alfa_soft
description: "ALFA SOFT — Enterprise Resource Planning & Business Management System (Native Windows Desktop)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Localization & Formatting
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Persistence (SQLite 3 via Native C-ABI FFI)
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0
  path_provider: ^2.1.5

  # Window & Desktop Ergonomics
  window_manager: ^0.4.3

  # Cryptography, Licensing & Identifiers
  uuid: ^4.5.1
  crypto: ^3.0.6
  cryptography: ^2.7.2

  # Typography & Icons
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
